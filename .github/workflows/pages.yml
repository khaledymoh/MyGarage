# Publishes the download page (site/) to GitHub Pages: https://<owner>.github.io/<repo>/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# (Pages needs a public repository on GitHub's Free plan.)
name: Download page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - 'design/app-icon/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp -r site/. _site/
          cp docs/screenshots/*.webp _site/screenshots/
          cp design/app-icon/mygarage-icon-squircle.svg _site/icon.svg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
